# Render Blueprint — Ykay College EduPortal production web service.
#
# Create a Render PostgreSQL database separately, in the same region as this
# web service. Set DATABASE_URL in the Render dashboard to that database's
# Internal Database URL; do not use the temporary sandbox PGlite database.
#
# Boot flow (docker-entrypoint.sh): prisma migrate deploy → optional CBT bank
# seed (idempotent, SEED_CBT_ON_BOOT=true) → optional super-admin ensure →
# node server.js. /api/health gates traffic.

services:
  - type: web
    name: ykay-college
    runtime: docker
    repo: https://github.com/Teamthy/ykay_eduport-
    plan: starter # $7/mo; free services sleep after 15 min idle
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # ── Data (Render PostgreSQL — create separately in the same region) ──
      - key: DATABASE_URL
        sync: false # Render PostgreSQL Internal Database URL; never commit it
      # ── Boot behaviour ───────────────────────────────────────────────────
      - key: SEED_CBT_ON_BOOT
        value: "true" # idempotent: skips stems that already exist
      - key: SUPER_ADMIN_EMAIL
        sync: false # set to provision/ensure the first super admin at boot
      - key: SUPER_ADMIN_PASSWORD
        sync: false # set privately for initial provisioning/rotation only
      - key: SUPER_ADMIN_NAME
        sync: false
      # ── App ──────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: APP_READINESS_MODE
        value: final # temporary is only for an explicitly incomplete site shell
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AUTH_SECRET
        sync: false # required; generate a fresh 32+ character secret
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # https://<your-render-host-or-custom-domain>
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false # use live keys only for production; test keys for staging
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false # required in production for distributed rate limiting
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Email (transactional) — required for password resets/invites.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional auth names retained for integrations that still use them.
      - key: SESSION_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      # Trusted proxy chain and tenant SaaS switch. Platform signup stays off
      # for the Ykay College single-tenant launch.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ENABLE_PLATFORM_SIGNUP
        value: "false"
      - key: ALLOW_MEMORY_RATE_LIMITS
        value: "false"
      # S3-compatible private bucket is mandatory for admissions documents.
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ADMISSIONS_PREFIX
        value: admissions
      # Required for final readiness. Temporary mode may boot without a
      # scanner, but admissions document intake remains disabled until set.
      - key: MALWARE_SCANNER_URL
        sync: false
      # Notification dispatcher: a managed cron/worker must call the job URL.
      - key: JOBS_SECRET
        sync: false
      # Observability and Virtual are optional integrations; SSO remains
      # disabled until the separate Virtual service is configured and tested.
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_VIRTUAL_URL
        value: https://virtual.ykaycollege.com
      - key: COLLEGE_SSO_SECRET
        sync: false

  # Same-image one-shot worker. This is the documented notification cadence
  # for the Render launch target; the web service continues to own DB writes.
  - type: cron
    name: ykay-notification-dispatch
    runtime: docker
    repo: https://github.com/Teamthy/ykay_eduport-
    plan: starter
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    envVars:
      - key: EDUPORTAL_CRON_MODE
        value: "true"
      - key: EDUPORTAL_BASE_URL
        sync: false # HTTPS origin of the ykay-college web service/custom domain
      - key: JOBS_SECRET
        sync: false # must match the web service's JOBS_SECRET exactly
