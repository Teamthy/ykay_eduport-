name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (non-blocking)
        # Surfaces high+ vulns in the run log. Non-blocking because the only
        # fixes are dev-toolchain majors (eslint 10 / expo 57) that would break
        # the build. Reviewed manually.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check code formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

  schema-drift:
    name: Schema Drift
    runs-on: ubuntu-latest
    # Builds a throwaway Postgres from the migration history and asserts it
    # matches schema.prisma. Catches the class of bug where a model or column
    # is declared and used in code but never migrated — which shipped twice
    # (DeviceToken, StudentProfile.photoUrl) and only failed on environments
    # built from scratch, never on a dev machine patched with `prisma db push`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Assert no schema drift
        run: npm run check:drift
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Verify RLS tenant isolation
        run: npm run verify:rls
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-test-secret-that-is-at-least-32-chars-long"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          PAYSTACK_PUBLIC_KEY: "pk_test_ci"
          PAYSTACK_SECRET_KEY: "sk_test_ci"

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # mobile/ has no committed lockfile yet. Commit mobile/package-lock.json
        # to switch to `npm ci` + npm caching for speed and determinism.
        run: npm install

      - name: Validate Expo project (expo-doctor)
        # Verifies Expo SDK / package compatibility + app.json config. Surfaced
        # as info (non-blocking) until confirmed green; promote to a hard gate
        # by removing continue-on-error.
        run: npx --yes expo-doctor@latest
        continue-on-error: true
