name: Seed the CBT question bank (Staging)

# Repeatable seed for the reviewed 19,796-row curriculum-aligned bank.
#
# It is deliberately Staging-only and manual:
#   * production-migrations.yml owns Production; this workflow cannot reach it
#     because prisma/cbt-seed.ts refuses any host that is not the configured
#     Staging host, and refuses pooled Neon URLs;
#   * the first step is a read-only preflight, so a malformed CSV fails before
#     a single row is written;
#   * before a staging write, the exact protected host is checked and pending
#     Prisma migrations are applied to that Staging database;
#   * attestation (making exact source rows visible to students in practice) is
#     separately confirmed and records the GitHub dispatch actor, citation,
#     timestamp and workflow run without mapping that actor to an app user.
#
# Required configuration
#   secret STAGING_DIRECT_DATABASE_URL   direct (unpooled) Neon Staging URL
#   vars   STAGING_DATABASE_HOST         hostname only, e.g. ep-xxx-123456.aws.neon.tech
#   vars   PRODUCTION_DATABASE_STATUS    AVAILABLE | NOT_PROVISIONED
#   vars   PRODUCTION_DATABASE_HOST      hostname only, required when AVAILABLE
# Protect the `staging-seeds` environment with required reviewers.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "preflight is read-only; seed writes drafts; seed-and-attest records explicit review and publishes exact matches"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - seed
          - seed-and-attest
      bank_file:
        description: "CSV under prisma/ to seed"
        required: true
        type: string
        default: cbt-bank-19k-draft.csv
      confirmation:
        description: "For seed / seed-and-attest, type SEED STAGING to confirm the target"
        required: false
        type: string
        default: ""
      attestation_confirmation:
        description: "seed-and-attest only: type I REVIEWED THE CBT BANK after checking the source bank"
        required: false
        type: string
        default: ""
      attest_reference:
        description: "seed-and-attest only: the source the bank was checked against (min 10 chars)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: seed-cbt-bank-staging
  cancel-in-progress: false

jobs:
  seed:
    name: ${{ inputs.operation }} · ${{ inputs.bank_file }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging-seeds
    env:
      CBT_BANK_FILE: ${{ inputs.bank_file }}

    steps:
      - name: Refuse to run from a non-main branch
        if: inputs.operation != 'preflight' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Seeding writes to the Staging database, so it only runs from main. Dispatch preflight to validate another branch."
          exit 1

      - name: Require explicit confirmation before writing
        if: inputs.operation != 'preflight'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "SEED STAGING" ]]; then
            echo "::error::Dispatch with confirmation=\"SEED STAGING\". Nothing was written."
            exit 1
          fi

      - name: Require explicit review attestation inputs
        if: inputs.operation == 'seed-and-attest'
        env:
          ATTEST_CONFIRMATION: ${{ inputs.attestation_confirmation }}
          ATTEST_REFERENCE: ${{ inputs.attest_reference }}
        run: |
          if [[ "$ATTEST_CONFIRMATION" != "I REVIEWED THE CBT BANK" || ${#ATTEST_REFERENCE} -lt 10 ]]; then
            echo "::error::seed-and-attest needs confirmation=\"I REVIEWED THE CBT BANK\" and an attest_reference of at least 10 characters."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.operation == 'preflight' && github.ref || 'main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight the bank file (read-only)
        # Runs the seed's own parser, so the counts here are exactly what the
        # import below will attempt.
        run: npm run cbt:preflight

      - name: Generate Prisma client
        if: inputs.operation != 'preflight'
        run: npx prisma generate

      - name: Verify staging target and apply pending migrations
        if: inputs.operation != 'preflight'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          PRODUCTION_DATABASE_STATUS: ${{ vars.PRODUCTION_DATABASE_STATUS }}
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Set STAGING_DIRECT_DATABASE_URL in the protected staging-seeds environment."
            exit 1
          fi
          printf '::add-mask::%s\n' "$DATABASE_URL"
          npm run db:seed-staging-demo -- --check-target
          # Prisma exits 1 when migrations are pending. Accept that specific status as
          # the expected pre-deploy state, but fail on connection/configuration errors.
          set +e
          status_output=$(npx prisma migrate status --schema prisma/schema.prisma 2>&1)
          status_code=$?
          set -e
          printf '%s\n' "$status_output"
          if [[ "$status_code" -ne 0 ]]; then
            if [[ "$status_code" -ne 1 ]] || ! grep -Fq 'Following migrations have not yet been applied:' <<< "$status_output"; then
              exit "$status_code"
            fi
          fi
          npx prisma migrate deploy --schema prisma/schema.prisma
          npx prisma migrate status --schema prisma/schema.prisma

      - name: Seed as drafts
        if: inputs.operation != 'preflight'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          CBT_SEED_TARGET: staging
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          PRODUCTION_DATABASE_STATUS: ${{ vars.PRODUCTION_DATABASE_STATUS }}
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Set STAGING_DIRECT_DATABASE_URL in the protected staging-seeds environment."
            exit 1
          fi
          printf '::add-mask::%s\n' "$DATABASE_URL"
          CBT_SEED_TARGET=staging npm run cbt:seed

      - name: Record GitHub actor attestation for exact bank matches
        if: inputs.operation == 'seed-and-attest'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          CBT_SEED_TARGET: staging
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          PRODUCTION_DATABASE_STATUS: ${{ vars.PRODUCTION_DATABASE_STATUS }}
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          CBT_ATTEST_ACTOR: ${{ github.actor }}
          CBT_ATTEST_REFERENCE: ${{ inputs.attest_reference }}
          CBT_ATTEST_CONFIRMATION: ${{ inputs.attestation_confirmation }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Set STAGING_DIRECT_DATABASE_URL in the protected staging-seeds environment."
            exit 1
          fi
          printf '::add-mask::%s\n' "$DATABASE_URL"
          CBT_SEED_TARGET=staging npm run cbt:seed

      - name: Summary
        if: always()
        run: |
          {
            echo "### CBT bank · ${{ inputs.operation }}"
            echo ""
            echo "- file: \`${{ inputs.bank_file }}\`"
            if [[ "${{ inputs.operation }}" != "preflight" ]]; then
              echo "- target: Staging Neon branch (host checked by \`prisma/cbt-seed.ts\`)"
              echo "- imports are drafts; only exact matching source rows with structurally valid content can be attested"
              if [[ "${{ inputs.operation }}" == "seed-and-attest" ]]; then
                echo "- external reviewer: GitHub actor \`${{ github.actor }}\` (recorded with workflow run and date; not mapped to an app user)"
              fi
            fi
            echo "- Production is never touched by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
